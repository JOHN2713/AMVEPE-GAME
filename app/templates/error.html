{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block body %}
<main class="mx-auto flex min-h-screen max-w-2xl flex-col items-center justify-center gap-6 px-6 text-center">
  <img src="{{ url_for('static', filename='img/logo-perseo-pets.png') }}" alt="Perseo Pets" class="h-16 w-auto">
  <h1 class="text-4xl font-extrabold">{{ title }}</h1>
  <p class="text-2xl text-muted">{{ message }}</p>
  <a href="{{ url_for('pages.register') }}" class="btn-primary">Volver al inicio</a>
</main>
{% endblock %}
